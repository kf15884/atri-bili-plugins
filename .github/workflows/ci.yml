name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check:clean
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-packages
          path: dist/
